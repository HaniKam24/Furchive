# Render Blueprint — defines the two services that make up the always-on
# preview: the Express API and the React (Vite) frontend. Render redeploys
# both automatically on every push to main.
#
# One-time setup (do this in the Render dashboard, not in code):
#   1. New -> Blueprint -> connect this GitHub repo -> Render finds this file.
#   2. Render creates both services below. For each "sync: false" env var,
#      Render will prompt you to paste in the real value (these are secrets
#      and are never committed to git).
#   3. After the first deploy, note the frontend's URL (e.g.
#      https://furchive-frontend.onrender.com) — that's the link to bookmark.
#
# See docs/deploying-to-render.md for the full walkthrough.

services:
  # Express API (artifacts/api-server) — talks to Supabase and Anthropic,
  # and handles auth itself via better-auth (session cookies, no external
  # auth provider).
  - type: web
    name: furchive-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # No manual `corepack enable`/`prepare` here — Render's build image
    # ships Corepack already enabled, and it reads the pinned pnpm version
    # from the "packageManager" field in the root package.json. Manually
    # running `corepack enable` on the static site's build image fails
    # (EROFS: read-only file system, unlink '/usr/bin/pnpm') because that
    # image already has pnpm linked at a path Corepack can't rewrite.
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm -r --filter "@workspace/api-server..." run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # Render's Node runtime sets this by default, but it's made explicit
      # here rather than relied on implicitly — better-auth's built-in
      # rate limiting on auth endpoints (e.g. 3 sign-in attempts/10s) is
      # gated on NODE_ENV === "production".
      - key: NODE_ENV
        value: production
      # PORT is provided automatically by Render — the app already reads it.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Sends the "verify your email" link on signup — required, sign-in
      # is blocked until verified. resend.com -> API Keys.
      - key: RESEND_API_KEY
        sync: false
      # Optional — defaults to Resend's sandbox sender if unset, which can
      # only deliver to the email on the Resend account itself until a
      # real domain is verified there (resend.com -> Domains).
      - key: RESEND_FROM_EMAIL
        sync: false
      # better-auth needs its own public URL for cookies/CSRF — this is
      # this same service's Render URL, not localhost.
      # NOTE: Render assigns a new random suffix (e.g. "-68wo") whenever a
      # service is created/renamed — this placeholder URL must be replaced
      # with the real one shown in the Render dashboard once the renamed
      # "furchive-api" service exists. Same for the rewrite destination below.
      - key: BETTER_AUTH_URL
        value: https://furchive-api.onrender.com
      # @better-auth/infra dash() plugin key (Better Auth dashboard -> Install
      # Plugin step). Use a separate key from the one in local .env if the
      # dashboard supports per-environment keys — don't reuse the dev one.
      - key: BETTER_AUTH_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional — the app runs fine without it, errors just won't be
      # reported anywhere. sentry.io -> Settings -> Projects -> api-server
      # -> Client Keys (DSN).
      - key: SENTRY_DSN
        sync: false
      # Filled in with the frontend's Render URL once it's known, so the
      # API accepts direct cross-origin requests from it too (the static
      # site's rewrite rule below is the primary path, this is a fallback).
      - key: WEB_ORIGIN
        sync: false
      # "Sign in with Google" button. Optional — leave both blank to leave
      # the button off. See .env.example for where these values come from.
      # (Apple sign-in was dropped for now — needs a paid Apple Developer account.)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # Vite/React frontend (artifacts/furchive) — this is the link
  # you bookmark and click to see the latest pushed version.
  - type: web
    runtime: static
    name: furchive-frontend
    branch: main
    autoDeploy: true
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm -r --filter "@workspace/furchive..." run build
    staticPublishPath: artifacts/furchive/dist/public
    routes:
      # Same-origin API calls: the app's code calls relative /api/... paths,
      # including for auth. This proxies those through to the API service
      # so the browser never has to deal with cross-origin requests.
      #
      # This matters beyond convenience for "Sign in with Google"
      # specifically: onrender.com is on the Public Suffix List, so this
      # frontend and the api-server's own distinct *.onrender.com address
      # are different *sites* to the browser, not just different origins —
      # a cookie can't reliably be set across that boundary via a direct
      # cross-origin request (confirmed the hard way). Auth requests must
      # keep arriving through this same-site proxy; the api-server's own
      # oAuthProxy() plugin (lib/auth/src/auth.ts) handles bridging the
      # actual cross-site hop to Google without depending on a cookie
      # surviving it.
      - type: rewrite
        source: /api/*
        destination: https://furchive-api.onrender.com/api/*
      # Client-side routing (wouter) — unmatched paths fall back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
