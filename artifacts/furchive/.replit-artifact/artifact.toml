kind = "web"
previewPath = "/"
title = "Furchive"
description = "An owner-first pet health companion for organizing health records, medications, reminders, and AI-assisted care insights in one reassuring place."
version = "1.0.0"
id = "artifacts/furchive"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24465

[services.development]
run = "pnpm --filter @workspace/furchive run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/furchive", "run", "build" ]
serve = "static"
publicDir = "artifacts/furchive/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24465"
BASE_PATH = "/"
