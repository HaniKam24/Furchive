name: CI

# Runs on every PR and every push to main — the baseline safety net this
# repo didn't have before: typecheck, build, and (for the packages that
# have them) automated tests, instead of relying entirely on manual review
# and hand-testing before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Matches the project's own canonical command (see docs/PROJECT.md) —
      # this already runs typecheck first, then builds every package.
      - name: Typecheck & build
        run: pnpm run build

      - name: Test
        run: pnpm -r --if-present run test
